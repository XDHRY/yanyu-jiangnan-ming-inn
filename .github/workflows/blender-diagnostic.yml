name: Blender diagnostic loop

on:
  public:
  push:
    branches: [main]
    paths:
      - "source/**"
      - "source_*.py"
      - "data_*.json"
      - "texture_*.png"
      - "asset_library_hires/**"
      - "ci/**"
      - "requirements-ci.txt"
      - ".github/workflows/blender-diagnostic.yml"
  pull_request:
    branches: [main]
    paths:
      - "source/**"
      - "source_*.py"
      - "data_*.json"
      - "texture_*.png"
      - "asset_library_hires/**"
      - "ci/**"
      - "requirements-ci.txt"
      - ".github/workflows/blender-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install Python geometry dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Prepare reproducible CI workspace
        run: python ci/prepare_workspace.py

      - name: Build latest procedural scene
        run: python .ci_work/build_scene.py

      - name: Refine Ming materials and joinery
        run: python .ci_work/refine_ming.py

      - name: Validate generated GLB
        run: python .ci_work/validate_ming.py

      - name: Validate expanded material contract
        run: python ci/validate_review_contract.py

      - name: Validate landscape clearance and waterline
        run: python ci/validate_landscape.py

      - name: Validate architectural support and detail budget
        run: python ci/validate_architecture.py

      - name: Install Blender and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y blender xvfb
          mkdir -p diagnostics
          blender --version | tee diagnostics/blender-version.txt
          blender --background --python-expr "import bpy; assert bpy.app.version >= (4,0,0), bpy.app.version_string; print('BLENDER_RUNTIME_OK', bpy.app.version_string)"

      - name: Render ten low-cost diagnostic views
        run: xvfb-run -a blender --background --python ci/blender_diagnostic.py -- --input .ci_work/ming_review.glb --output diagnostics

      - name: Build diagnostic contact sheet and iteration index
        run: python ci/make_contact_sheet.py diagnostics

      - name: Validate diagnostic outputs
        run: python ci/validate_diagnostics.py diagnostics

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-diagnostic-${{ github.run_number }}
          path: |
            diagnostics/
            .ci_work/build-report.json
            .ci_work/review/report.json
            .ci_work/review/validation.json
            .ci_work/review/ci-contract.json
            .ci_work/review/landscape-validation.json
            .ci_work/review/architecture-validation.json
            .ci_work/review/pavilion-layout.json
            .ci_work/ci-input-manifest.json
            ci/review_matrix.json
            ci/iteration_state.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lightweight review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-preview-${{ github.run_number }}
          path: |
            diagnostics/*.png
            diagnostics/*.jpg
            diagnostics/*.json
            .ci_work/review/landscape-validation.json
            .ci_work/review/architecture-validation.json
            .ci_work/review/pavilion-layout.json
          if-no-files-found: warn
          retention-days: 14
